<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | LUMINA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; background: #f8fafc; color: #111827; }
        .glass { background: rgba(255,255,255,0.94); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .account-flyout { width: min(360px, calc(100vw - 1rem)); background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 10px 28px rgba(15, 23, 42, 0.15); }
        .signin-btn { display: inline-block; width: 130px; text-align: center; background: #facc15; border: 1px solid #f59e0b; color: #111827; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 7px; }
        .signin-btn:hover { background: #fbbf24; }
        .account-col-title { font-size: 15px; font-weight: 700; color: #1f2937; margin-bottom: 8px; }
        .account-link { display: block; font-size: 12px; color: #374151; line-height: 1.55; }
        .account-link:hover { color: #111827; text-decoration: underline; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .panel-card { background: #fff; border: 1px solid #e8edf5; border-radius: 18px; box-shadow: 0 12px 28px rgba(15,23,42,0.06); }
        .hero-panel { background: linear-gradient(140deg, #f0f7ff 0%, #ffffff 40%, #f5f0ff 100%); }
        .hero-title { color: #111827; font-size: 32px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 4px; }
        .hero-subtitle { color: #4b5563; font-size: 15px; line-height: 1.55; }
        .hero-stats { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e8edf5; }
        .hero-stat { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .hero-stat-dot { width: 10px; height: 10px; border-radius: 999px; flex-shrink: 0; }
        .hero-stat-value { font-size: 15px; line-height: 1; font-weight: 800; color: #111827; }
        .hero-stat-label { font-size: 15px; line-height: 1; font-weight: 500; color: #667085; }

        .orders-panel {
            background: #fff;
            border: 1px solid #e8edf5;
            border-radius: 18px;
            box-shadow: 0 12px 28px rgba(15,23,42,0.06);
            padding: 20px 28px;
        }

        .panel-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 18px;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 220px;
        }

        .search-box input {
            width: 100%;
            border: 1px solid #d8e1ec;
            border-radius: 10px;
            padding: 10px 14px 10px 40px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
            background: #fafbfd;
        }

        .search-box input:focus {
            border-color: #6366f1;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.08);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .status-filter {
            min-width: 170px;
            border: 1px solid #d8e1ec;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            background: #fafbfd;
            outline: none;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid #e8edf5;
            border-radius: 10px;
        }

        .orders-table {
            width: 100%;
            min-width: 1080px;
            border-collapse: collapse;
        }

        .orders-table thead tr {
            background: #f8fafc;
            border-bottom: 2px solid #e7edf5;
        }

        .orders-table th,
        .orders-table td {
            padding: 14px 12px;
            text-align: left;
            font-size: 13px;
            vertical-align: middle;
        }

        .orders-table th {
            color: #232f3e;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 11px;
        }

        .orders-table tbody tr {
            border-bottom: 1px solid #edf2f7;
            transition: background-color 0.2s;
        }

        .orders-table tbody tr:hover {
            background: #fafbfd;
        }

        .order-id {
            color: #232f3e;
            font-weight: 700;
        }

        .product-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 260px;
        }

        .product-thumb {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #eceff3;
        }

        .product-name {
            font-weight: 600;
            color: #232f3e;
            line-height: 1.3;
        }

        .seller-name {
            color: #555;
            font-weight: 600;
            font-size: 12px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-confirmed { background: #ede9fe; color: #5b21b6; }
        .status-processing { background: #e9f2ff; color: #0f4f9b; }
        .status-packed { background: #fff7ed; color: #9a3412; }
        .status-shipped { background: #d1ecf1; color: #0c5460; }
        .status-delivered { background: #d4edda; color: #155724; }
        .status-cancelled { background: #f8d7da; color: #721c24; }
        .status-returned { background: #fee2e2; color: #9f1239; }
        .status-refunded { background: #f3f4f6; color: #374151; }

        .price {
            color: #b12704;
            font-weight: 700;
        }

        .action-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .action-btn {
            border: 1px solid #d8e1ec;
            background: #fff;
            color: #1f2937;
            border-radius: 9px;
            padding: 8px 11px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .action-btn:hover {
            background: #f8fafc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }

        .action-btn.track {
            border-color: #cfe2ff;
            color: #114ea0;
            background: #f5f9ff;
        }

        .action-btn.cancel {
            border-color: #f5c2c7;
            color: #842029;
            background: #fff5f6;
        }

        .action-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .empty-state {
            text-align: center;
            padding: 26px;
            color: #666;
            font-size: 14px;
            display: none;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .page-btn {
            border: 1px solid #d8e1ec;
            background: #fff;
            color: #1f2937;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover {
            background: #f8fafc;
        }

        .page-btn.active {
            background: #232f3e;
            color: #fff;
            border-color: #232f3e;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .mobile-orders {
            display: none;
            gap: 12px;
            flex-direction: column;
        }

        .mobile-order-card {
            border: 1px solid #e8edf5;
            border-radius: 16px;
            background: #fff;
            padding: 14px;
            box-shadow: 0 6px 18px rgba(15,23,42,0.05);
        }

        .mobile-top {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .mobile-meta p { margin-bottom: 4px; }

        .mobile-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1500;
            padding: 12px;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: #fff;
            width: min(560px, 100%);
            border-radius: 20px;
            border: 1px solid #e8edf5;
            box-shadow: 0 24px 56px rgba(0,0,0,0.2);
            padding: 18px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #edf0f3;
            padding-bottom: 10px;
        }

        .close-modal {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 24px;
            color: #777;
        }

        @media (max-width: 768px) {
            .table-wrap { display: none; }
            .mobile-orders { display: flex; }
            .orders-panel { padding: 16px; }
            .hero-title { font-size: 26px; }
            .hero-subtitle { font-size: 14px; }
            .hero-stats { gap: 12px 16px; }
        }
    </style>
	<script src="/customer-pages/auth.js"></script>
	<script src="/customer-pages/page-access.js"></script>
</head>
<body class="bg-[#f9fafb] text-[#1a1a1a]">

    <nav class="fixed top-0 w-full z-[100] glass">
        <div class="max-w-[1440px] mx-auto px-4 lg:px-8 h-20 flex items-center justify-between gap-6">
                <div class="flex items-center gap-2 shrink-0">
                    <a href="all_product_spages.html" class="md:hidden p-2" aria-label="Search">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </a>
                <a href="homepage.html" class="text-2xl font-bold tracking-tighter uppercase shrink-0">Lumina</a>
            </div>

            <div class="hidden md:flex flex-grow relative max-w-2xl mx-auto">
                <input type="text" placeholder="Search for unique products, clothing or artisans..." class="w-full bg-gray-100 border-transparent border focus:border-black focus:bg-white rounded-full py-2.5 px-6 pl-12 text-sm transition-all outline-none">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
            </div>

            <div class="flex items-center gap-2 lg:gap-6 shrink-0">
                <div id="accountMenuWrap" class="relative group max-sm:w-full">
                    <button id="accountMenuButton" type="button" class="flex items-center gap-2 px-2 py-1 cursor-pointer hover:bg-gray-100 rounded-lg transition-colors max-sm:justify-center max-sm:px-3">
                        <i data-lucide="user" class="w-5 h-5"></i>
                        <span id="accountMenuLabel" class="hidden sm:block text-xs font-bold uppercase tracking-widest">Account</span>
                    </button>
                    <div id="accountMenuDropdown" class="absolute top-full right-0 mt-1 z-50 hidden group-hover:block max-sm:fixed max-sm:inset-x-2 max-sm:top-20 max-sm:bottom-auto max-sm:rounded-2xl max-sm:shadow-2xl max-sm:max-h-[calc(100vh-5rem)] max-sm:overflow-y-auto">
                        <div id="accountMenuContent" class="account-flyout"></div>
                    </div>
                </div>
                <a href="cart.html" class="relative p-2">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                    <span id="cartCountBadge" class="absolute top-0 right-0 bg-red-500 text-white text-[9px] w-4 h-4 flex items-center justify-center rounded-full font-bold">0</span>
                </a>
                <a href="wishlist.html" class="relative p-2"><i data-lucide="heart" class="w-5 h-5"></i></a>
            </div>
        </div>
    </nav>

    <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black/50 z-40 md:hidden"></div>

    <main class="mt-20 p-4 lg:p-8 min-h-[calc(100vh-5rem)]">
        <div class="max-w-7xl mx-auto space-y-6">
            <section class="panel-card hero-panel p-5 lg:p-7">
                <div class="flex flex-col sm:flex-row sm:items-center gap-4">
                    <div class="w-14 h-14 bg-white border border-indigo-100 rounded-2xl flex items-center justify-center shadow-sm flex-shrink-0">
                        <i data-lucide="receipt-text" class="w-7 h-7 text-indigo-600"></i>
                    </div>
                    <div>
                        <h1 class="hero-title">My Orders</h1>
                        <p class="hero-subtitle">View and manage all your orders.</p>
                    </div>
                </div>
                <div class="hero-stats">
                    <div class="hero-stat"><span class="hero-stat-dot" style="background:#fbbf24;"></span><span id="statAllOrders" class="hero-stat-value">0</span><span class="hero-stat-label">All</span></div>
                    <div class="hero-stat"><span class="hero-stat-dot" style="background:#3b82f6;"></span><span id="statInProgressOrders" class="hero-stat-value">0</span><span class="hero-stat-label">In Progress</span></div>
                    <div class="hero-stat"><span class="hero-stat-dot" style="background:#10b981;"></span><span id="statDeliveredOrders" class="hero-stat-value">0</span><span class="hero-stat-label">Delivered</span></div>
                    <div class="hero-stat"><span class="hero-stat-dot" style="background:#9ca3af;"></span><span id="statCancelledOrders" class="hero-stat-value">0</span><span class="hero-stat-label">Cancelled</span></div>
                </div>
            </section>

            <section class="orders-panel">
                <div class="panel-controls">
                    <div class="search-box">
                        <i data-lucide="search" class="w-4 h-4 search-icon"></i>
                        <input id="searchInput" type="text" placeholder="Search by Order ID or product name...">
                    </div>
                    <select id="statusFilter" class="status-filter">
                        <option value="all">All</option>
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="processing">Processing</option>
                        <option value="packed">Packed</option>
                        <option value="shipped">Shipped</option>
                        <option value="delivered">Delivered</option>
                        <option value="cancelled">Cancelled</option>
                        <option value="returned">Returned</option>
                        <option value="refunded">Refunded</option>
                    </select>
                </div>

                <div class="table-wrap">
                    <table class="orders-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Product Image</th>
                                <th>Product Name</th>
                                <th>Seller Name</th>
                                <th>Order Date</th>
                                <th>Order Status</th>
                                <th>Total Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody"></tbody>
                    </table>
                </div>

                <div id="mobileOrders" class="mobile-orders"></div>
                <div id="emptyState" class="empty-state">No orders found for your current search/filter.</div>
                <div id="pagination" class="pagination"></div>
            </section>
        </div>
    </main>

    <div id="trackingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="text-lg font-bold text-[#232f3e]">Shipment Tracking</h3>
                <button class="close-modal" data-close="trackingModal">&times;</button>
            </div>
            <div id="trackingModalBody" class="text-sm text-gray-700 space-y-2"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = `${window.location.origin}/api`;
        const IS_LIVE_HOST = location.protocol !== 'file:';

        function resolveCurrentUserId() {
            try {
                const rawUser = localStorage.getItem('lumina.auth.user') || localStorage.getItem('lumina.customer.session');
                if (rawUser) {
                    const parsed = JSON.parse(rawUser);
                    return String(parsed.id || parsed.userId || parsed.customerId || '1').trim();
                }
            } catch (_) {}
            return '1';
        }

        async function fetchJson(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...(options.headers || {})
                }
            });

            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success === false) {
                throw new Error(payload.message || 'Request failed');
            }

            return payload;
        }

        function resolveAuthState() {
            const state = { isLoggedIn: false, fullName: '' };

            try {
                const rawUser = localStorage.getItem('lumina.auth.user') || localStorage.getItem('lumina.customer.session');
                const isLoggedIn = localStorage.getItem('lumina.isLoggedIn') === 'true';
                if (rawUser) {
                    const parsed = JSON.parse(rawUser);
                    const name = String(parsed.fullName || parsed.name || '').trim();
                    state.isLoggedIn = Boolean(name) || isLoggedIn;
                    state.fullName = name;
                } else {
                    state.isLoggedIn = isLoggedIn;
                }
            } catch (_) {
                state.isLoggedIn = localStorage.getItem('lumina.isLoggedIn') === 'true';
            }

            return state;
        }

        function renderAccountFlyout() {
            const auth = resolveAuthState();
            const content = document.getElementById('accountMenuContent');
            const label = document.getElementById('accountMenuLabel');
            if (!content || !label) return;

            if (!auth.isLoggedIn) {
                label.textContent = 'Account';
                content.innerHTML = `
                    <div class="px-4 py-3 border-b border-gray-200 text-center">
                        <a href="login_register.html" class="signin-btn">Sign in</a>
                        <p class="text-[10px] text-gray-500 mt-1">New customer? <a href="login_register.html" class="text-blue-600 hover:underline">Start here.</a></p>
                    </div>
                    <div class="grid grid-cols-2 gap-0">
                        <div class="px-4 py-3 border-r border-gray-200">
                            <h4 class="account-col-title">Your Lists</h4>
                            <a href="wishlist.html" class="account-link">Create a List</a>
                            <a href="login_register.html" class="account-link">Find a List or Registry</a>
                        </div>
                        <div class="px-4 py-3">
                            <h4 class="account-col-title">Your Account</h4>
                            <a href="login_register.html" class="account-link">Customer Dashboard</a>
                            <a href="login_register.html" class="account-link">My Profile</a>
                            <a href="login_register.html" class="account-link">My Orders</a>
                            <a href="login_register.html" class="account-link">Cart</a>
                            <a href="login_register.html" class="account-link">My Addresses</a>
                            <a href="login_register.html" class="account-link">Messages</a>
                            <a href="login_register.html" class="account-link">Returns & Refunds</a>

                            <a href="login_register.html" class="account-link">Help & Support</a>
                        </div>
                    </div>
                `;
            } else {
                const firstName = auth.fullName ? auth.fullName.split(' ')[0] : 'Account';
                label.textContent = firstName;
                content.innerHTML = `
                    <div class="px-4 py-3 border-b border-gray-200 text-center">
                        <a href="Customer_Dashboard.html" class="signin-btn">Go to Dashboard</a>
                        <p class="text-[10px] text-gray-500 mt-1">Signed in as ${auth.fullName || 'Customer'}</p>
                    </div>
                    <div class="grid grid-cols-2 gap-0">
                        <div class="px-4 py-3 border-r border-gray-200">
                            <h4 class="account-col-title">Your Lists</h4>
                            <a href="wishlist.html" class="account-link">Wishlist</a>
                            <a href="my_returns_refunds.html" class="account-link">Returns & Refunds</a>
                            <a href="my_messages.html" class="account-link">Messages</a>
                        </div>
                        <div class="px-4 py-3">
                            <h4 class="account-col-title">Your Account</h4>
                            <a href="Customer_Dashboard.html" class="account-link">Customer Dashboard</a>
                            <a href="my_profile.html" class="account-link">My Profile</a>
                            <a href="my_orders.html" class="account-link">My Orders</a>
                            <a href="cart.html" class="account-link">Cart</a>
                            <a href="my_addresses.html" class="account-link">My Addresses</a>
                            <a href="my_messages.html" class="account-link">Messages</a>
                            <a href="my_returns_refunds.html" class="account-link">Returns & Refunds</a>

                            <a href="help_support.html" class="account-link">Help & Support</a>
                        </div>
                    </div>
                `;
            }
        }

        const accountMenuButton = document.getElementById('accountMenuButton');
        const accountMenuDropdown = document.getElementById('accountMenuDropdown');
        const accountMenuWrap = document.getElementById('accountMenuWrap');

        if (accountMenuButton && accountMenuDropdown) {
            accountMenuButton.addEventListener('click', () => {
                const isHidden = accountMenuDropdown.classList.contains('hidden');
                accountMenuDropdown.classList.toggle('hidden', !isHidden);
                if (!isHidden) {
                    accountMenuDropdown.classList.add('hidden');
                }
            });

            document.addEventListener('click', (event) => {
                if (accountMenuWrap && !accountMenuWrap.contains(event.target)) {
                    accountMenuDropdown.classList.add('hidden');
                }
            });
        }

        renderAccountFlyout();

        let orders = [];

        const rowsPerPage = 5;
        let currentPage = 1;

        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const ordersTableBody = document.getElementById('ordersTableBody');
        const mobileOrders = document.getElementById('mobileOrders');
        const pagination = document.getElementById('pagination');
        const emptyState = document.getElementById('emptyState');

        async function loadCartCount() {
            if (!IS_LIVE_HOST) {
                const badge = document.getElementById('cartCountBadge');
                if (badge) badge.textContent = '0';
                return;
            }
            try {
                const userId = resolveCurrentUserId();
                const payload = await fetchJson(`${API_BASE_URL}/cart?userId=${encodeURIComponent(userId)}`);
                const data = payload?.data || payload || {};
                const badge = document.getElementById('cartCountBadge');
                if (badge) badge.textContent = String(Number(data.totalItems || data.totals?.itemCount || 0));
            } catch (_) {
                const badge = document.getElementById('cartCountBadge');
                if (badge) badge.textContent = '0';
            }
        }

        function refreshHeaderStats() {
            const all = orders.length;
            const inProgress = orders.filter((o) => o.status === 'pending' || o.status === 'confirmed' || o.status === 'processing' || o.status === 'packed' || o.status === 'shipped').length;
            const delivered = orders.filter((o) => o.status === 'delivered').length;
            const cancelled = orders.filter((o) => o.status === 'cancelled' || o.status === 'refunded').length;

            document.getElementById('statAllOrders').textContent = all;
            document.getElementById('statInProgressOrders').textContent = inProgress;
            document.getElementById('statDeliveredOrders').textContent = delivered;
            document.getElementById('statCancelledOrders').textContent = cancelled;
        }

        function formatDate(date) {
            const d = new Date(date);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function formatPrice(value) {
            return 'Rs. ' + (Number(value) || 0).toLocaleString();
        }

        function canCancel(status) {
            return status === 'pending' || status === 'confirmed' || status === 'processing';
        }

        function filteredOrders() {
            const query = searchInput.value.trim().toLowerCase();
            const status = statusFilter.value;

            return orders.filter((order) => {
                const matchesSearch = order.id.toLowerCase().includes(query) || order.productName.toLowerCase().includes(query);
                const matchesStatus = status === 'all' ? true : order.status === status;
                return matchesSearch && matchesStatus;
            });
        }

        function badgeClass(status) {
            return 'status-' + status;
        }

        function renderTableRows(pageData) {
            ordersTableBody.innerHTML = pageData.map((order, idx) => {
                const globalIndex = (currentPage - 1) * rowsPerPage + idx;
                return `
                    <tr>
                        <td><span class="order-id">${order.id}</span></td>
                        <td><img src="${order.image}" alt="${order.productName}" class="product-thumb"></td>
                        <td>
                            <div class="product-name">${order.productName}</div>
                        </td>
                        <td><span class="seller-name">${order.seller}</span></td>
                        <td>${formatDate(order.date)}</td>
                        <td><span class="status-badge ${badgeClass(order.status)}">${order.label || order.status}</span></td>
                        <td><span class="price">${formatPrice(order.total)}</span></td>
                        <td>
                            <div class="action-group">
                                <button class="action-btn" onclick="viewOrder(${globalIndex})"><i data-lucide="eye" class="w-3 h-3"></i>View Order</button>
                                <button class="action-btn track" onclick="openTracking(${globalIndex})"><i data-lucide="map-pinned" class="w-3 h-3"></i>Track</button>
                                <button class="action-btn cancel" onclick="cancelOrder(${globalIndex})" ${canCancel(order.status) ? '' : 'disabled'}><i data-lucide="x-circle" class="w-3 h-3"></i>Cancel</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderMobileCards(pageData) {
            mobileOrders.innerHTML = pageData.map((order, idx) => {
                const globalIndex = (currentPage - 1) * rowsPerPage + idx;
                return `
                    <article class="mobile-order-card">
                        <div class="mobile-top">
                            <img src="${order.image}" alt="${order.productName}" class="product-thumb" style="width:64px;height:64px;">
                            <div class="mobile-meta">
                                <p class="order-id">${order.id}</p>
                                <p class="product-name">${order.productName}</p>
                                <p class="seller-name">Seller: ${order.seller}</p>
                            </div>
                        </div>
                        <p class="order-meta">Date: ${formatDate(order.date)}</p>
                        <p class="order-meta" style="margin:6px 0;"><span class="status-badge ${badgeClass(order.status)}">${order.label || order.status}</span></p>
                        <p class="price">${formatPrice(order.total)}</p>
                        <div class="mobile-actions">
                            <button class="action-btn" onclick="viewOrder(${globalIndex})"><i data-lucide="eye" class="w-3 h-3"></i>View Order</button>
                            <button class="action-btn track" onclick="openTracking(${globalIndex})"><i data-lucide="map-pinned" class="w-3 h-3"></i>Track</button>
                            <button class="action-btn cancel" onclick="cancelOrder(${globalIndex})" ${canCancel(order.status) ? '' : 'disabled'}><i data-lucide="x-circle" class="w-3 h-3"></i>Cancel</button>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / rowsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            let controls = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">Prev</button>`;
            for (let i = 1; i <= totalPages; i++) {
                controls += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }
            controls += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">Next</button>`;
            pagination.innerHTML = controls;
        }

        function renderOrders() {
            refreshHeaderStats();
            const data = filteredOrders();
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageData = data.slice(start, end);

            emptyState.style.display = data.length === 0 ? 'block' : 'none';
            document.querySelector('.table-wrap').style.display = data.length === 0 && window.innerWidth >= 769 ? 'none' : '';
            mobileOrders.style.display = data.length === 0 ? 'none' : '';

            renderTableRows(pageData);
            renderMobileCards(pageData);
            renderPagination(data.length);
            lucide.createIcons();
        }

        function changePage(page) {
            currentPage = page;
            renderOrders();
        }

        function viewOrder(index) {
            const data = filteredOrders();
            const order = data[index] || orders[index];
            if (!order) return;
            window.location.href = `order_details.html?orderId=${encodeURIComponent(order.id)}`;
        }

        function openTracking(index) {
            const order = filteredOrders()[index] || orders[index];
            if (!order) return;
            const body = document.getElementById('trackingModalBody');
            body.innerHTML = `
                <p><strong>Order ID:</strong> ${order.id}</p>
                <p><strong>Current Status:</strong> <span class="status-badge ${badgeClass(order.status)}">${order.label || order.status}</span></p>
                <p><strong>Tracking Update:</strong> ${order.tracking}</p>
            `;
            document.getElementById('trackingModal').classList.add('show');
        }

        function cancelOrder(index) {
            const data = filteredOrders();
            const order = data[index] || orders[index];
            if (!order) return;

            if (!canCancel(order.status)) {
                alert('This order cannot be cancelled because it is already shipped or completed.');
                return;
            }

            const confirmed = confirm(`Cancel order ${order.id}?`);
            if (!confirmed) return;

            (async () => {
                try {
                    const userId = resolveCurrentUserId();
                    await fetchJson(`${API_BASE_URL}/customer/orders/${encodeURIComponent(order.id)}/cancel?userId=${encodeURIComponent(userId)}`, {
                        method: 'POST'
                    });
                    await loadOrdersFromApi();
                } catch (error) {
                    alert(error.message || 'Unable to cancel order right now.');
                }
            })();
        }

        function normalizeOrderRow(row) {
            const status = String(row.displayStatus || row.status || 'pending').toLowerCase();
            const label = String(row.displayLabel || row.displayStatus || row.status || 'Pending');
            const trackingByStatus = {
                pending: 'Order placed and waiting for seller confirmation.',
                confirmed: 'Order confirmed by seller and being prepared.',
                processing: 'Processing and quality check in progress.',
                packed: 'Order is packed and ready for shipment.',
                ready_for_pickup: 'Your order is ready for pickup.',
                shipped: row.trackingNumber ? `In transit - Tracking #${row.trackingNumber}` : 'In transit - expected delivery soon.',
                delivered: 'Delivered to customer address.',
                cancelled: 'Order was cancelled before dispatch.',
                returned: 'Order has been returned.',
                refunded: 'Order amount has been refunded.'
            };

            return {
                id: row.orderId || row.orderDbId,
                productName: row.productName || 'Order item',
                seller: row.storeName || row.sellerName || 'Seller',
                date: row.orderDate,
                status,
                label,
                total: Number(row.totalAmount || row.lineAmount || 0),
                image: row.productImage || 'https://via.placeholder.com/80',
                tracking: trackingByStatus[status] || 'Tracking information will be updated shortly.'
            };
        }

        async function refreshHeaderStatsFromApi() {
            if (!IS_LIVE_HOST) {
                refreshHeaderStats();
                return;
            }
            try {
                const userId = resolveCurrentUserId();
                const summary = await fetchJson(`${API_BASE_URL}/customer/orders/summary?userId=${encodeURIComponent(userId)}`);
                document.getElementById('statAllOrders').textContent = Number(summary.total) || 0;
                document.getElementById('statInProgressOrders').textContent = Number(summary.pending) || 0;
                document.getElementById('statDeliveredOrders').textContent = Number(summary.delivered) || 0;
                document.getElementById('statCancelledOrders').textContent = (Number(summary.cancelled) || 0) + (Number(summary.refunded) || 0);
            } catch (_) {
                refreshHeaderStats();
            }
        }

        async function loadOrdersFromApi() {
            if (!IS_LIVE_HOST) {
                orders = [];
                renderOrders();
                const badge = document.getElementById('cartCountBadge');
                if (badge) badge.textContent = '0';
                return;
            }
            try {
                const userId = resolveCurrentUserId();
                const status = statusFilter.value || 'all';
                const search = searchInput.value.trim();
                const payload = await fetchJson(`${API_BASE_URL}/customer/orders?userId=${encodeURIComponent(userId)}&status=${encodeURIComponent(status)}&search=${encodeURIComponent(search)}&page=1&pageSize=100`);
                orders = Array.isArray(payload.data) ? payload.data.map(normalizeOrderRow) : [];
                currentPage = 1;
                renderOrders();
                await refreshHeaderStatsFromApi();
                await loadCartCount();
            } catch (error) {
                orders = [];
                renderOrders();
                alert(error.message || 'Failed to load orders.');
            }
        }

        searchInput.addEventListener('input', () => {
            loadOrdersFromApi();
        });

        statusFilter.addEventListener('change', () => {
            loadOrdersFromApi();
        });

        document.querySelectorAll('.close-modal').forEach((btn) => {
            btn.addEventListener('click', () => {
                const id = btn.getAttribute('data-close');
                document.getElementById(id).classList.remove('show');
            });
        });

        document.querySelectorAll('.modal').forEach((modal) => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('show');
            });
        });

        const sidebarToggle = document.getElementById('sidebarToggle');

        if (IS_LIVE_HOST) {
            loadOrdersFromApi();
        } else {
            orders = [];
            renderOrders();
            const badge = document.getElementById('cartCountBadge');
            if (badge) badge.textContent = '0';
        }
        lucide.createIcons();
    </script>
</body>
</html>
