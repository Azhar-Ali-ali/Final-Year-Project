    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #111827; }
        .glass { background: rgba(255,255,255,0.94); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .account-flyout { width: 360px; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 10px 28px rgba(15, 23, 42, 0.15); }
        .signin-btn { display: inline-block; width: 130px; text-align: center; background: #facc15; border: 1px solid #f59e0b; color: #111827; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 7px; }
        .signin-btn:hover { background: #fbbf24; }
        .account-col-title { font-size: 15px; font-weight: 700; color: #1f2937; margin-bottom: 8px; }
        .account-link { display: block; font-size: 12px; color: #374151; line-height: 1.55; }
        .account-link:hover { color: #111827; text-decoration: underline; }
        .panel-card { background: #fff; border: 1px solid #e8edf5; border-radius: 18px; box-shadow: 0 12px 28px rgba(15,23,42,0.06); }
        .page-header { margin-bottom: 20px; }
        .page-title { font-size: 24px; font-weight: 600; color: #232f3e; margin-bottom: 10px; }
        .page-subtitle { font-size: 14px; color: #666; }
        .seller-item { border: 1px solid #ecf1f6; border-radius: 12px; transition: all 0.2s ease; cursor: pointer; }
        .seller-item:hover { border-color: #d5deea; background: #fbfdff; }
        .seller-item.active { border-color: #111827; background: #f7fafc; box-shadow: 0 6px 18px rgba(15,23,42,0.06); }
        .chat-history { height: 480px; overflow-y: auto; scroll-behavior: smooth; background: linear-gradient(180deg, #fcfdff 0%, #f8fbff 100%); }
        .message-row { display: flex; margin-bottom: 14px; }
        .message-row.sent { justify-content: flex-end; }
        .message-row.received { justify-content: flex-start; }
        .message-bubble { max-width: min(78%, 520px); border-radius: 16px; padding: 10px 12px; font-size: 13px; line-height: 1.5; }
        .message-row.sent .message-bubble { background: #111827; color: #fff; border-bottom-right-radius: 6px; }
        .message-row.received .message-bubble { background: #ffffff; color: #1f2937; border: 1px solid #e3e9f2; border-bottom-left-radius: 6px; }
        .message-time { margin-top: 4px; font-size: 10px; opacity: 0.75; font-weight: 600; letter-spacing: 0.02em; }
        .chat-input { border: 1px solid #d6dfeb; border-radius: 12px; padding: 12px 14px; font-size: 14px; outline: none; width: 100%; }
        .chat-input:focus { border-color: #111827; box-shadow: 0 0 0 3px rgba(17,24,39,0.08); }
        .badge-unread { min-width: 22px; height: 22px; border-radius: 999px; background: #dc2626; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; padding: 0 6px; }
        .contact-list-panel.is-hidden, .chat-panel.is-open { display: none; }

        @media (min-width: 768px) {
            .content-shell { margin-left: 256px; }
            .contact-list-panel, .chat-panel { display: flex; }
            .mobile-back-btn { display: none; }
        }

        @media (max-width: 767px) {
            .content-shell { margin-left: 0; }
            .chat-layout { grid-template-columns: 1fr; }
            .contact-list-panel { display: flex; }
            .chat-panel { display: none; }
            .contact-list-panel.is-hidden { display: none; }
            .chat-panel.is-open { display: flex; }
            .mobile-back-btn { display: inline-flex; }
            .chat-history { height: min(56vh, 420px); }
            .panel-card { padding: 0; }
            .chat-layout > aside, .chat-layout > article { border-radius: 0; border: 0; }
        }

        @media (max-width: 900px) {
            .chat-history { height: 380px; }
        }
    </style>
</head>

    <script>
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function openMobileSidebar() {
            if (!sidebar || !sidebarOverlay) return;
            sidebar.classList.remove('hidden');
            sidebarOverlay.classList.remove('hidden');
        }

        function closeMobileSidebar() {
            if (!sidebar || !sidebarOverlay) return;
            sidebar.classList.add('hidden');
            sidebarOverlay.classList.add('hidden');
        }

        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', () => {
                if (sidebar && sidebar.classList.contains('hidden')) {
                    openMobileSidebar();
                } else {
                    closeMobileSidebar();
                }
            });
        }

        if (sidebarOverlay) {
            sidebarOverlay.addEventListener('click', closeMobileSidebar);
        }

        if (sidebar) {
            sidebar.querySelectorAll('a').forEach((link) => {
                link.addEventListener('click', () => {
                    if (window.innerWidth < 768) {
                        closeMobileSidebar();
                    }
                });
            });
        }

        const profileDropdownToggle = document.getElementById('profileDropdownToggle');
        const profileDropdownMenu = document.getElementById('profileDropdownMenu');

        if (profileDropdownToggle && profileDropdownMenu) {
            profileDropdownToggle.addEventListener('click', (event) => {
                event.stopPropagation();
                const isOpen = profileDropdownMenu.classList.contains('profile-menu-open');
                document.querySelectorAll('#profileDropdownMenu').forEach((menu) => {
                    menu.classList.remove('profile-menu-open');
                    menu.classList.add('dropdown-hidden');
                    menu.style.opacity = '0';
                    menu.style.transform = 'scale(0.95)';
                    menu.style.pointerEvents = 'none';
                });

                if (!isOpen) {
                    profileDropdownMenu.classList.add('profile-menu-open');
                    profileDropdownMenu.classList.remove('dropdown-hidden');
                    profileDropdownMenu.style.opacity = '1';
                    profileDropdownMenu.style.transform = 'scale(1)';
                    profileDropdownMenu.style.pointerEvents = 'auto';
                }
            });

            document.addEventListener('click', (event) => {
                if (!profileDropdownMenu.contains(event.target) && !profileDropdownToggle.contains(event.target)) {
                    profileDropdownMenu.classList.remove('profile-menu-open');
                    profileDropdownMenu.classList.add('dropdown-hidden');
                    profileDropdownMenu.style.opacity = '0';
                    profileDropdownMenu.style.transform = 'scale(0.95)';
                    profileDropdownMenu.style.pointerEvents = 'none';
                }
            });
        }
    </script>
